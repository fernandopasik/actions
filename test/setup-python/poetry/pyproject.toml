[tool.poetry]
name = "setup-python-poetry"
version = "0.0.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
Django = "^6.1.1"
djangorestframework = "^3.18.1"
langchain = "^1.4.0"
langchain-anthropic = "^1.7.2"
langchain-core = "^1.6.3"
pydantic = "^2.13.5"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
django-stubs = "^6.1.0"
djangorestframework-stubs = "^3.18.1"
mdformat = "^1.0.0"
mdformat-front-matters = "^2.0.0"
mdformat-gfm = "^1.0.0"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
pre-commit-hooks = "^6.0.0"
pylint = "^4.0.8"
pylint-django = "^2.8.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-django = "^4.14.0"
yamllint = "^1.38.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
